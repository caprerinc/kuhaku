# 空白図鑑 — 暮らし編 判定記録
#
# 2026-09-10: 公開にあたり、現行イベントの文面から内部用語（レビュー体制の呼称、
#   confidence の英語表記、企画上の「看板」など）を取り除いた。
#   **判定・確からしさ・根拠の中身は一切変更していない。** 語の置換のみ。
#
# ■ 追記型（append-only）である
#   過去の判定イベントは**書き換えない**。訂正するときは新しいイベントを足し、
#   `supersedes` に訂正対象の判定IDを書く。現在の判定は「最後の有効なイベント」から
#   生成する。誤字の修正も原則として追記する。
#
#   理由: 訂正履歴を公開することがこのサイトの信用の中身だから。
#   上書きしてしまうと「最初から正しかったこと」になり、公開する意味がなくなる。
#
# ■ 判定値（5値）
#   "欠落"     … 独立記事も、上位・隣接記事内の実質的な記述も確認できない
#   "薄い"     … 独立記事はあるが、英語版で扱われ日本語版で確認できない論点を人手で特定した
#   "実質包含" … 独立記事は無いが、上位・隣接記事の中に記述がある
#   "該当なし" … この調査でいう空白にはあたらない。日本語版が同等以上（反例として掲載する）
#   "判定不能" … 別名不明・粒度が違う等で判定できない
#
#   ※ 文字数が少ないだけでは「薄い」にしない。必ず本文を読み、
#      英語版で扱われていて日本語版の記事では確認できない論点を1つ以上特定すること。
#   ※ 「欠落」を出す前に必ず上位・隣接記事を読むこと。完全一致チェックだけでは
#      実質包含を見逃す（実際に2回見逃した。j-0002 と j-0013 を参照）。
#
# ■ 実質包含の判定規則（2026-09-09 制定）
#   **単一の**隣接記事が概念を**定義**している場合のみ「実質包含」とする。
#   - 用語を節見出しや同義語として挙げるだけでは足りない（定義があること）
#   - 複数の記事を読者が合成しなければ概念全体にならない場合は実質包含としない
#   - 包含先の記述量は判定とは別に記録する（1文でも定義があれば実質包含）
#   - 対応する独立記事が存在するなら、隣接記事に分散があっても「薄い」を覆さない
#
# ■ 「欠落」に confidence: high は付けない（2026-09-09 制定）
#   不在は原理的に完全証明できない。確認した隣接記事とその revision ID、
#   使った検索語をすべて記録した上で、最大 medium とする。
#   実際、high を付けた「欠落」のうち2件が後から実質包含だと判明した。
#
# ■ 隣接記事は revision ID を必ず記録する
#   記事名だけでは第三者が不在主張を反証できない。
#
# ■ confidence
#   "high"   … 本文を通読し、根拠を引用付きで示せる
#   "medium" … 本文を確認したが、網羅的には読んでいない
#   "low"    … 観測値のみ。公開時は必ず「未検証」と併記する

schema_version = "1.1.0"
edition = "living"

