# postinstall スクリプトの実行を許すパッケージを明記する。
# 対話承認（pnpm approve-builds）だと何を許したかが記録に残らないので使わない。
# pnpm 11 以降が読むのは allowBuilds（pnpm 12 は onlyBuiltDependencies を読まない）。
allowBuilds:
  esbuild: true # Vite のバンドラ。ネイティブバイナリの配置に postinstall が要る
  workerd: true # Cloudflare のローカル実行環境（wrangler / vitest で使う）
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
