# postinstall スクリプトの実行を許すパッケージを明記する。
# 対話承認（pnpm approve-builds）だと何を許したかが記録に残らないので使わない。
# pnpm 11 が読むのは allowBuilds。onlyBuiltDependencies は旧版との互換で併記する
# （LaneDuel も同じ形）。
allowBuilds:
  esbuild: true # Vite のバンドラ。ネイティブバイナリの配置に postinstall が要る
  workerd: true # Cloudflare のローカル実行環境（wrangler / vitest で使う）
minimumReleaseAgeExclude:
  - wrangler@4.143.0
  - '@cloudflare/workers-types@5.20260928.1'
  - '@voidzero-dev/vite-plus-core@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
  - vite-plus@1.0.0
onlyBuiltDependencies:
  - esbuild
  - workerd
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
