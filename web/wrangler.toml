# 配信の identity。ここは移行で流用・変更してはいけない。
#
# LaneDuel は Pages モード（pages_build_output_dir）だが、空白図鑑は独自ドメインを
# wrangler の route で持っている。Pages にすると独自ドメインの紐付けが設定ファイルの
# 外（ダッシュボード）に出てしまうため、**Workers モードのまま**にしている。
name = "kuhaku-zukan"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# workers.dev のサブドメインは開けない。caprer.co.jp は別 Worker(caprer) が持つ。
workers_dev = false

[[routes]]
pattern = "kuhaku.caprer.co.jp"
custom_domain = true
zone_name = "caprer.co.jp"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"
# 旧構成から引き継ぐ。移行時に落としかけた。
# 404.html を返す（旧構成では 404.html 自体が無く既定に落ちていたが、
# 事前生成で 404.html ができたので今度は実際に効く）。
not_found_handling = "404-page"
# /corrections で corrections.html を返す。既定任せにせず明示する。
html_handling = "auto-trailing-slash"

[observability]
enabled = true
