# 公開した数字を、保存済みの応答から作り直して照合する。
#
# このリポジトリの売りは「手元で検算できる」ことなので、その検算自体が
# 動かなくなっていることに気づかない状態を作らない。訂正を PR で受ける
# 設計にしてあるため、外から来た変更もここを通る。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # **検算の経路**に依存パッケージを持ち込まない。第三者が pip install 無しで
      # 公開値を再計算できることが製品の一部。表示層(web/)の node 依存は別の話で、
      # verify にも stats にも関与しない。
      - name: 検算の経路に依存が無いことを確かめる
        run: |
          test ! -f requirements.txt && test ! -f pyproject.toml \
            || { echo "依存ファイルが増えている"; exit 1; }

      # build → verify → 文面チェック。ネットワークは使わない。
      - name: 生成と検査
        run: ./run.sh check

      - name: 素朴判定との突き合わせ
        run: ./run.sh stats

      # コミット済みの公開物が、いまの判定から再生成したものと一致するか。
      # judgments/concepts を変えて再生成し忘れたまま push した、を捕まえる。
      # （公開HTMLへの手書きは build が上書きするので、ここでは検知できない）
      - name: 公開物が判定から再生成したものと一致するか
        run: |
          if ! git diff --exit-code -- site/public data/dataset.csv data/dataset.json data/viewmodel.json; then
            echo "::error::公開物が判定から再生成した内容と一致しない。./run.sh build してコミットすること。"
            exit 1
          fi

  # 表示層。移行中は「ビルドが通り、配信物に余計なものが混ざらない」ことだけを見る。
  # 事前生成HTMLへの主張の指紋照合は、部品移植が終わってから有効にする（第3段階の完了条件）。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # uses: は defaults.working-directory が効かないので、リポジトリ直下の
      # package.json を見にいって版を決められず落ちる。web/ を明示する。
      # 版は web/package.json の packageManager 一箇所で決める。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      - name: 型検査
        run: pnpm check

      - name: ビルド
        run: pnpm build

      # 除外設定に頼らず、配信されるファイルの一覧そのものを見る。
      # adapter-cloudflare は .assetsignore を自前のもので上書きするため。
      - name: 配信物の一覧
        run: python3 ../site/parity.py --inventory .svelte-kit/cloudflare
