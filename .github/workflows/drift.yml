# 測定した版から Wikipedia がどれだけ変わったかを見る。
#
# 手動起動のみ。凍結したプロジェクトに、誰も見ない定期実行を足さない。
# 結果はコミットせず成果物として出す（配信は ./run.sh deploy で明示的に行う）。
name: drift

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load R2 actions from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-artifact-actions
          persist-credentials: false
          sparse-checkout: .github/actions/ci-artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 現在の版と比べる
        run: ./run.sh drift | tee drift-report.txt

      - uses: ./.ci-artifact-actions/.github/actions/ci-artifacts/upload
        with:
          name: drift
          path: |
            drift-report.txt
            data/drift/
          retention-days: 7
