# 空白図鑑 — 暮らし編 概念リスト
#
# eligibility: MVP対象適合性フィルタ（計画書 §5 [0]）
#   "a" = 国に依存しない人間行動・健康・生活上の概念
#   "b" = 日本国内での発生・利用を、独立した日本語資料2件以上で確認できる
#   "c" = 海外制度だが、日本居住者の生活に直接影響する
#
#   これは「日本語版Wikipediaにその記事が必要か」を裁定する基準ではない。
#   今回の暮らし編で扱う対象を選ぶ編集基準である。
#
# eligibility_status:
#   "confirmed" = 根拠を確認済み
#   "pending"   = 未確認。Day 1-2 で日本語資料2件を確認するまで採用しない
#
# ja_candidates は「候補」であって答えではない。パイプラインが Wikidata の
# ラベル・別名・全文検索の結果を足し、すべてを完全一致で存在確認する。

schema_version = "1.0.0"
edition = "living"
edition_label = "暮らし編"

