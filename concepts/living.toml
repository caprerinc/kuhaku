# ---------------------------------------------------------------- くらし・権利

[[concept]]
id = "drip-pricing"
theme = "くらし・権利"
en_title = "Drip pricing"
ja_candidates = ["ドリップ・プライシング", "ドリップ価格", "段階的価格表示", "追加料金の後出し"]
eligibility = "b"
eligibility_status = "pending"
eligibility_note = """**pending のまま（2026-09-09 時点）。公開対象に含めない。**
海外制度そのものではなく商慣行なので基準は b が正しい（当初 c としていたのを訂正）。
調査したが、日本国内での発生を示す独立した日本語資料2件の要件を満たせていない:
  - darkpatterns.jp に解説記事があるが、これは現象の解説であって国内発生の記録ではない
  - 「映画館大手のドリッププライシングに罰金」の報道は海外事例
消費者庁の景品表示法ガイドブックは有利誤認表示一般を扱うもので、
ドリップ・プライシングを名指ししていない。
要件を満たす資料が見つかるまで採用しない。"""
why = "最後まで進むと料金が増えている手口。名前を知らないと抗議もできない"

[[concept]]
id = "unit-price"
theme = "くらし・権利"
en_title = "Unit price"
ja_candidates = ["単位価格表示", "ユニットプライス", "単価表示", "単位価格"]
eligibility = "b"
eligibility_status = "confirmed"
eligibility_note = """確認済み(2026-09-14)。国内の制度として実在する:
(1) 東京都消費生活条例に基づく「単位価格等の表示」。68品目に基準が定められている（東京くらしWEB／都例規集）。
(2) 京都市消費生活総合センターにも同種の基準がある。
国内で実際に使われている表示制度のため、基準 b を満たす。"""
why = "100gあたりいくらか。買い物の比較の基礎だが、名前と仕組みが日本語で説明されていない"

[[concept]]
id = "dark-pattern"
theme = "くらし・権利"
en_title = "Dark pattern"
ja_candidates = ["ダークパターン"]
eligibility = "a"
eligibility_status = "confirmed"
why = "解約させないUI、勝手にチェックの入った同意欄。設計による誘導"

