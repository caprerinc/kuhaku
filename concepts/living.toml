theme = "くらし・権利"
en_title = "Greenwashing"
ja_candidates = ["グリーンウォッシング", "グリーンウォッシュ"]
eligibility = "a"
eligibility_status = "confirmed"
why = "環境に良さそうに見せる表示。買う側が見抜くための概念"

[[concept]]
id = "right-to-disconnect"
theme = "くらし・権利"
en_title = "Right to disconnect"
ja_candidates = ["つながらない権利", "接続を断つ権利"]
eligibility = "c"
eligibility_status = "confirmed"
eligibility_note = """確認済み(2026-09-09)。厚生労働省「労働基準関係法制研究会」報告書(2025-01-08公表)が
勤務時間外の連絡について労使での社内ルール検討とガイドライン策定を提言。
また厚労省「労働時間制度等に関するアンケート調査」(令和5年、3,441社)で
勤務時間外連絡に「特段ルールを整備していない」企業が36.8%と最多。
海外制度だが日本の労働政策の議論対象になっており、日本居住者の生活に直接影響する（基準c）。"""
why = "勤務時間外の連絡を断る権利。日本でも議論が始まっている"

[[concept]]
id = "planned-obsolescence"
theme = "くらし・権利"
en_title = "Planned obsolescence"
ja_candidates = ["計画的陳腐化", "計画的旧式化"]
eligibility = "a"
eligibility_status = "confirmed"
why = "★反例候補。日本語版のほうが厚い可能性"

[[concept]]
id = "cooling-off-period"
theme = "くらし・権利"
en_title = "Cooling-off period (consumer rights)"
ja_candidates = ["クーリングオフ", "クーリング・オフ"]
eligibility = "b"
eligibility_status = "confirmed"
eligibility_note = "特定商取引法に基づく日本の制度として確立している"
why = "★反例。日本語版のほうが厚い（実測 ja 8,550B > en 5,529B）。3点セットの③"

